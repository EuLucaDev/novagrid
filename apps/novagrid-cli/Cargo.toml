[package]
name = "novagrid-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NovaGrid command line: inspect, convert, evaluate, script and serve MCP without a window"
publish = false

[lints]
workspace = true

[[bin]]
name = "novagrid-cli"
path = "src/main.rs"

[dependencies]
novagrid-engine = { workspace = true }
novagrid-mcp = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# `check`: validating the packages NovaGrid writes (content types, relationships).
zip = { workspace = true }
quick-xml = { workspace = true }
